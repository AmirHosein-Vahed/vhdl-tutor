# Single source of truth for the course inventory.
# scripts/curriculum.py reads this file: statuses drive `make list` and `make test`.

[course]
name = "vhdl-tutor"
standard = "08"
language = "en"
second_language = "fa"
ghdl_min = "5.0"


[[topic]]
id = "00-hello-world"
title = "Hello world"
title_fa = "سلام، دنیا"
summary = "The smallest possible loop: write a design, write a testbench that checks it, run it, look at the waveform. Everything later in the course is this loop with more logic in the middle."

[[topic.lesson]]
id = "01-first-entity-and-testbench"
title = "First entity and testbench"
title_fa = "نخستین موجودیت و بستر آزمون"
status = "done"

